name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.0.0-glass)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ViaXTrace/winlator (contains redesigned UI resources)
        uses: actions/checkout@v4
        with:
          submodules: false
          path: repo

      - name: Clone original Winlator app source
        run: |
          echo "Cloning brunodev85/winlator-app..."
          git clone --depth=1 https://github.com/brunodev85/winlator-app winlator-src
          echo "Clone result:"
          ls winlator-src/

      - name: Apply glassmorphism UI resources on top of original source
        run: |
          echo "Applying glassmorphism redesign resources..."
          # Override drawable XMLs
          cp -rf repo/ui-resources/app/src/main/res/drawable/. winlator-src/app/src/main/res/drawable/
          # Override layout XMLs
          cp -rf repo/ui-resources/app/src/main/res/layout/. winlator-src/app/src/main/res/layout/
          # Override values (styles, colors)
          cp -rf repo/ui-resources/app/src/main/res/values/. winlator-src/app/src/main/res/values/
          echo "Resources applied. Verify styles.xml updated:"
          grep -c "glassmorphism\|5B8FFF\|080C14" winlator-src/app/src/main/res/values/styles.xml || true
          echo "Done applying UI resources."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          echo "y" | sdkmanager "ndk;24.0.8215888" "cmake;3.22.1" --channel=0
          echo "NDK_HOME=$ANDROID_HOME/ndk/24.0.8215888" >> $GITHUB_ENV
          echo "NDK installed."

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('winlator-src/*.gradle*', 'winlator-src/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Patch build.gradle to fix duplicate native libs conflict
        run: |
          python3 -c "
f = 'winlator-src/app/build.gradle'
c = open(f).read()
if 'packagingOptions' not in c:
    patch = '    packagingOptions {\n        pickFirst \"lib/**/*.so\"\n    }\n\n'
    c = c.replace('    lintOptions {', patch + '    lintOptions {')
    open(f, 'w').write(c)
    print('packagingOptions injected')
else:
    print('already present')
"
          echo "build.gradle after patch (packagingOptions section):"
          grep -A 5 "packagingOptions" winlator-src/app/build.gradle || echo "(none found)"

      - name: Make gradlew executable
        run: chmod +x winlator-src/gradlew

      - name: Build debug APK
        working-directory: winlator-src
        run: |
          ./gradlew assembleDebug --no-daemon -x lint --stacktrace 2>&1 | tail -100

      - name: Locate built APK
        id: apk
        run: |
          APK=$(find winlator-src -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Rename APK with branding
        run: |
          cp "${{ steps.apk.outputs.APK_PATH }}" "Winlator_glassmorphism_debug.apk"
          echo "APK ready: Winlator_glassmorphism_debug.apk"
          ls -lh Winlator_glassmorphism_debug.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Glassmorphism-APK
          path: Winlator_glassmorphism_debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "Winlator ${{ github.event.inputs.release_tag || github.ref_name }} — Glassmorphism UI"
          body: |
            ## Winlator Glassmorphism UI Redesign

            ### Visual Changes
            - **Deep dark surface** — `#080C14` base, `#0E1525` glass cards with `#1E2D4A` borders
            - **Gradient accent buttons** — `#5B8FFF → #8B5CF6` indigo-purple gradient, 12dp rounded
            - **Glass neutral buttons** — `#1A2540` fill, `#2D4270` stroke, fully rounded corners
            - **Glass input fields** — `#0E1525` dark fill, accent blue (`#5B8FFF`) focus border
            - **Glass card list items** — all containers wrapped in layered glass cards (14dp radius)
            - **Gradient nav drawer header** — blue diagonal gradient overlay
            - **Active nav items** — `#1A2540` glass highlight with 10dp radius
            - **All panels, dialogs, toolboxes, tabs, tables** fully restyled in the glass system
            - **Semi-transparent overlay toolbar** for in-game input controls (`#CC080C14`)
            - **Primary text** `#F0F4FF`, secondary `#8892B0`, muted `#4A6080`

            ### Tech Stack
            Wine · Box86/Box64 · DXVK · VKD3D · Mesa Turnip/Zink · Android ALSA

            > **Note:** Debug build. For production, see [brunodev85/winlator releases](https://github.com/brunodev85/winlator/releases).
          draft: false
          prerelease: true
          files: Winlator_glassmorphism_debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
