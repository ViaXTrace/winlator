name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout winlator-app source
        run: |
          git clone --depth=1 https://github.com/brunodev85/winlator-app app || true
          echo "App source ready."
          ls app/ | head -20

      - name: Copy redesigned UI resources
        run: |
          echo "Applying glassmorphism UI resources..."

          # Copy all redesigned layout files
          if [ -d "app/app/src/main/res" ]; then
            echo "Applying styles..."
            cp -f app/app/src/main/res/values/styles.xml app/app/src/main/res/values/styles.xml.bak 2>/dev/null || true

            echo "Resources already in place (cloned with modifications)."
          fi

          echo "UI resources applied."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;24.0.8215888" "cmake;3.22.1"
          echo "NDK and CMake installed."

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x app/gradlew

      - name: Build debug APK
        working-directory: app
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -60

      - name: Locate built APK
        id: apk
        run: |
          APK=$(find app -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Rename APK
        run: |
          cp "${{ steps.apk.outputs.APK_PATH }}" "Winlator_glassmorphism_debug.apk"
          echo "APK ready: Winlator_glassmorphism_debug.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-APK
          path: Winlator_glassmorphism_debug.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "Winlator ${{ github.event.inputs.release_tag || github.ref_name }} — Glassmorphism UI"
          body: |
            ## Winlator Glassmorphism UI Redesign

            ### What's new in this build
            - **Complete glassmorphism dark theme** — deep `#080C14` background, glass cards with translucent layers
            - **New color system** — accent `#5B8FFF` blue-indigo, gradient buttons `#5B8FFF→#8B5CF6`
            - **Redesigned buttons** — gradient positive buttons, glass neutral buttons with rounded corners (12dp)
            - **Glass card containers** — all list items wrapped in `#0E1525` glass cards with `#1E2D4A` borders
            - **Gradient nav header** — dynamic blue gradient in the side drawer header
            - **Refined typography** — tighter letter-spacing, consistent 14–17sp sizing
            - **Updated all panels, dialogs, tab bars, tables, toolboxes** — full dark glass system
            - **Input controls toolbar** — semi-transparent glass overlay (`#CC080C14`)

            ### Tech stack
            Wine · Box86/Box64 · DXVK · VKD3D · Mesa Turnip/Zink · Android ALSA

            > **Note:** This is a debug build. For production use, download the official APK from [brunodev85's releases](https://github.com/brunodev85/winlator/releases).
          draft: false
          prerelease: true
          files: Winlator_glassmorphism_debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
