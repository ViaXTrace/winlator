name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Bundle web assets
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          mkdir -p dist

          # Copy files that exist
          [ -f index.html ] && cp index.html dist/
          [ -f logo.png ]   && cp logo.png dist/
          [ -f README.md ]  && cp README.md dist/
          [ -f LICENSE ]    && cp LICENSE dist/
          [ -f serve.py ]   && cp serve.py dist/

          # Copy directories that exist
          for dir in input_controls installable_components wine_addons glibc_patches android_alsa; do
            [ -d "$dir" ] && cp -r "$dir" dist/ || echo "Skipping missing dir: $dir"
          done

          echo "Bundle contents:"
          find dist -maxdepth 2 | head -40

          zip -r "winlator-web-${TAG}.zip" dist/
          tar -czf "winlator-web-${TAG}.tar.gz" dist/
          echo "Archives created."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "Winlator ${{ steps.tag.outputs.TAG }} — Glassmorphism UI"
          body: |
            ## Winlator ${{ steps.tag.outputs.TAG }}

            ### What's new
            - **Redesigned glassmorphism UI/UX** — dark theme, glass cards, blur layers, scroll animations
            - Full project web page with installation guide, tips & compatibility list
            - Smooth animated background with floating orbs and grid
            - Navigation with anchor links and download CTA
            - Games ticker with 50+ compatible titles
            - Component version cards (Box64, DXVK, Wine)

            ### Installation
            1. Download **Winlator_11.0.apk** from [brunodev85 Releases](https://github.com/brunodev85/winlator/releases)
            2. Enable unknown sources on your Android device
            3. Install the APK — the app will auto-configure on first launch

            ### Tech stack
            - Wine · Box86/Box64 · DXVK · VKD3D · Mesa Turnip/Zink · Android ALSA
          draft: false
          prerelease: false
          files: |
            winlator-web-${{ steps.tag.outputs.TAG }}.zip
            winlator-web-${{ steps.tag.outputs.TAG }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: release

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
